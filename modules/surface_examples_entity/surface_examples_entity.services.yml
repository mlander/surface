services:
  # Which fields of a bundle's form display a resource can carry, and how
  # each field item's properties become structure keys; read by both
  # derivers and by the content entity storage.
  surface_examples_entity.field_item_derivation:
    class: Drupal\surface_examples_entity\FieldItemDerivation
    arguments: ['@entity_type.manager', '@entity_field.manager', '@entity_type.bundle.info', '@typed_data_manager', '@string_translation', '@surface.references']
  Drupal\surface_examples_entity\FieldItemDerivation: '@surface_examples_entity.field_item_derivation'

  # The variants an entity type's resource holds at `fields`, one per
  # bundle with a form display, named by its class where the blueprint
  # attaches them.
  Drupal\surface_examples_entity\Variants\BundleFieldStructures:
    arguments: ['@surface_examples_entity.field_item_derivation']
